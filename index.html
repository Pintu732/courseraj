<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Courseraj premium skill courses">
  <meta name="theme-color" content="#050608">
  <title>Courseraj — Learn • Upgrade • Succeed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/v6-hero.css">
</head>
<body>
<div class="v6-page">
  <header class="v6-nav">
    <a class="v6-brand" href="index.html" aria-label="Courseraj home">
      <span class="mini-logo"><span class="mini-c"></span><span class="mini-play"></span></span>
      <span class="brand-word">COURSE<b>RAJ</b></span>
    </a>

    <nav class="desktop-nav">
      <a class="active" href="index.html">Home</a>
      <a href="#trending">Courses</a>
      <a href="#categories">Categories</a>
      <a href="#premium">Premium</a>
      <a href="#about">About</a>
    </nav>

    <div class="nav-actions">
      <div class="nav-search">
        <span class="search-icon">⌕</span>
        <input id="heroSearch" type="search" placeholder="Search courses..." autocomplete="off">
        <div id="searchDropdown" class="search-dropdown hidden"></div>
      </div>
      <a id="topTelegram" class="login-btn" href="#" target="_blank" rel="noopener">Join</a>
    </div>
  </header>

  <main>
    <section class="v6-hero">
      <div class="cloud-field cloud-field-1"></div>
      <div class="cloud-field cloud-field-2"></div>
      <div class="cloud-field cloud-field-3"></div>
      <div class="fog fog-1"></div>
      <div class="fog fog-2"></div>
      <div class="fog fog-3"></div>
      <div class="fog fog-4"></div>
      <div class="red-glow glow-left"></div>
      <div class="red-glow glow-right"></div>

      <div class="hero-left">
        <div class="hero-logo-wrap">
          <div class="hero-logo">
            <div class="hero-logo-shadow"></div>
            <div class="hero-logo-ring"></div>
            <div class="hero-logo-inner"></div>
            <div class="hero-logo-edge"></div>
            <div class="hero-logo-play"></div>
            <div class="hero-logo-play-edge"></div>
            <div class="hero-logo-shine"></div>
            <div class="hero-logo-spark"></div>
          </div>
        </div>

        <div class="hero-copy">
          <h1>COURSE<span>RAJ</span></h1>
          <p class="tagline">LEARN <i>•</i> UPGRADE <i>•</i> SUCCEED</p>
        </div>
      </div>

      <div class="hero-right">
        <div id="heroCollage" class="hero-collage"></div>
      </div>

      <div class="hero-bottom-fade"></div>
    </section>

    <section id="trending" class="v6-section">
      <div class="section-head">
        <h2>Trending Courses</h2>
        <div class="slider-controls">
          <button id="slidePrev" aria-label="Previous">‹</button>
          <button id="slideNext" aria-label="Next">›</button>
        </div>
      </div>
      <div id="trendingRow" class="course-rail">
        <div class="loading-state">Loading courses…</div>
      </div>
    </section>

    <section id="categories" class="v6-section compact-section">
      <div class="section-head"><h2>Browse Categories</h2></div>
      <div id="categoryChips" class="category-chips"></div>
    </section>

    <section id="premium" class="premium-strip">
      <div><span>COURSERAJ PREMIUM</span><h2>Upgrade your skills. Faster.</h2></div>
      <a id="premiumTelegram" href="#" target="_blank" rel="noopener">Explore on Telegram ↗</a>
    </section>
  </main>

  <footer id="about" class="v6-footer">
    <div class="footer-brand">COURSE<span>RAJ</span></div>
    <p>Learn • Upgrade • Succeed</p>
  </footer>
</div>
<script type="module" src="js/public/v6-hero.js"></script>
</body>
</html>
